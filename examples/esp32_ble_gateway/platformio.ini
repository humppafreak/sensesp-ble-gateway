; SensESP BLE gateway on a standard ESP32-WROOM-32 dev board.
;
; Uses NativeBLE (Bluedroid) — the classic ESP32 has its own onboard
; BT/BLE controller, unlike the P4 (needs esp_hosted + a C6 companion)
; or the C5 (no Bluedroid support, so it uses NimBLE instead).

[platformio]
default_envs = esp32_ble_gateway

[env:esp32_ble_gateway]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = espidf, arduino

board = esp32dev

; Create dummy cert files needed by ESP Insights/RainMaker
extra_scripts = pre:create_dummy_certs.py

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -Werror=reorder

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D USE_ESP_IDF_LOG
    -D GATEWAY_HOSTNAME='"signalk-esp32-ble-gw"'

lib_ldf_mode = deep

lib_deps =
    https://github.com/SignalK/SensESP.git#main
    symlink://../../
    esp_websocket_client=https://components.espressif.com/api/downloads/?object_type=component&object_id=dbc87006-9a4b-45e6-a6ab-b286174cb413
